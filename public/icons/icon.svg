<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#121212"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Border glow -->
  <rect x="2" y="2" width="508" height="508" rx="94" fill="none" stroke="#22c55e" stroke-opacity="0.3" stroke-width="2"/>
  <!-- Letter L -->
  <text x="256" y="340" font-family="Georgia, serif" font-size="280" font-weight="400" font-style="italic" fill="#22c55e" text-anchor="middle">L</text>
  <!-- Subtle shine -->
  <rect x="0" y="0" width="512" height="256" rx="96" fill="url(#shine)" opacity="0.05"/>
  <defs>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>
</svg>
